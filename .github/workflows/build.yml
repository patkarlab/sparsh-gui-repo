name: Build the Linux package

# Builds dist/SPARSH-RunManager-<version>-linux-x86_64.tar.gz with packaging/build.sh
# and attaches it to a GitHub Release when a tag such as v1.1.0 is pushed.
# The build runs in an Ubuntu 22.04 container (glibc 2.35), so the package runs
# on Ubuntu 22.04 and newer.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-tk binutils git ca-certificates tar xvfb

      - uses: actions/checkout@v4

      - name: Build the package
        run: bash packaging/build.sh

      - name: Check that the tag matches the version in sparsh/__init__.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python3 -c "import sparsh; print(sparsh.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match __version__ = $VERSION" >&2
            exit 1
          fi

      - name: Smoke test the package
        # The window must stay open for 10 seconds on a virtual display: timeout then
        # ends it with status 124. A crash at start-up (a missing library, say) exits sooner.
        run: |
          cd dist/sparsh-run-manager
          set +e
          HOME=/tmp timeout 10 xvfb-run -a ./sparsh-run-manager
          status=$?
          set -e
          [ "$status" -eq 124 ] || { echo "The packaged app exited with status $status at start-up" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: SPARSH-RunManager-linux-x86_64
          path: dist/SPARSH-RunManager-*-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: "SPARSH Run Manager ${{ github.ref_name }}"
          body: |
            Linux x86_64 package (Ubuntu 22.04 or newer; other distributions with glibc 2.35 or newer).

            ```
            tar -xf SPARSH-RunManager-*-linux-x86_64.tar.gz
            cd sparsh-run-manager
            bash install.sh
            ```

            See the README for the requirements (a SPARSH installation with its conda environment)
            and for running from source on older systems.
          files: release-files/*
